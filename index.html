<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OriSquash · 图片压缩</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;600&display=swap');

:root {
  --bg: #0a0a0b;
  --surface: #141416;
  --surface-2: #1c1c20;
  --border: #2a2a30;
  --text: #e8e8ec;
  --text-2: #8a8a96;
  --accent: #00d4aa;
  --accent-dim: #00d4aa22;
  --accent-glow: #00d4aa44;
  --red: #ff4d6a;
  --green: #00d4aa;
  --radius: 16px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.header {
  padding: 24px 32px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(20px);
  position: sticky; top: 0; z-index: 100;
  background: var(--bg)/90;
}
.logo {
  font-size: 20px; font-weight: 700; letter-spacing: -0.5px;
  display: flex; align-items: center; gap: 10px;
}
.logo-icon {
  width: 32px; height: 32px;
  background: var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; color: var(--bg);
}
.header-info {
  font-size: 13px; color: var(--text-2);
  font-family: 'JetBrains Mono', monospace;
}
.header-badge {
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 6px;
  background: var(--accent-dim);
  color: var(--accent);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
}

.main {
  max-width: 960px;
  margin: 0 auto;
  padding: 48px 24px 80px;
}

.hero {
  text-align: center;
  margin-bottom: 48px;
}
.hero h1 {
  font-size: clamp(32px, 5vw, 48px);
  font-weight: 700;
  letter-spacing: -1.5px;
  line-height: 1.1;
  margin-bottom: 12px;
}
.hero h1 span { color: var(--accent); }
.hero p {
  font-size: 16px;
  color: var(--text-2);
  max-width: 520px;
  margin: 0 auto;
  line-height: 1.6;
}

.dropzone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 64px 32px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
  background: var(--surface);
}
.dropzone::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 50%, var(--accent-dim), transparent 70%);
  opacity: 0;
  transition: opacity 0.3s;
}
.dropzone:hover, .dropzone.dragover {
  border-color: var(--accent);
  background: var(--surface-2);
}
.dropzone:hover::before, .dropzone.dragover::before { opacity: 1; }
.dropzone-icon {
  width: 64px; height: 64px;
  margin: 0 auto 20px;
  border-radius: 16px;
  background: var(--accent-dim);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  position: relative;
}
.dropzone h3 {
  font-size: 18px; font-weight: 600;
  margin-bottom: 8px;
  position: relative;
}
.dropzone p {
  font-size: 14px; color: var(--text-2);
  position: relative;
}
.dropzone input { display: none; }

.controls {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px;
  margin: 24px 0;
  flex-wrap: wrap;
}
.quality-control {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 20px;
  flex: 1; min-width: 280px;
}
.quality-control label {
  font-size: 13px; color: var(--text-2);
  white-space: nowrap;
  font-weight: 500;
}
.quality-control input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  outline: none;
}
.quality-control input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  box-shadow: 0 0 10px var(--accent-glow);
}
.quality-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px; font-weight: 600;
  color: var(--accent);
  min-width: 36px; text-align: right;
}

.format-control {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px;
}
.format-btn {
  padding: 8px 16px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--text-2);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.format-btn.active {
  background: var(--accent);
  color: var(--bg);
}

.btn-row {
  display: flex; gap: 12px; margin: 16px 0;
  flex-wrap: wrap;
}
.btn {
  padding: 12px 24px;
  border: none;
  border-radius: 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: flex; align-items: center; gap: 8px;
}
.btn-primary {
  background: var(--accent);
  color: var(--bg);
}
.btn-primary:hover {
  box-shadow: 0 0 24px var(--accent-glow);
  transform: translateY(-1px);
}
.btn-primary:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}
.btn-secondary {
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { border-color: var(--text-2); }

.file-list {
  margin-top: 24px;
  display: flex; flex-direction: column; gap: 8px;
}
.file-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 20px;
  display: flex; align-items: center; gap: 16px;
  transition: all 0.3s;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.file-thumb {
  width: 48px; height: 48px;
  border-radius: 8px;
  object-fit: cover;
  background: var(--surface-2);
  flex-shrink: 0;
}
.file-info { flex: 1; min-width: 0; }
.file-name {
  font-size: 14px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 4px;
}
.file-meta {
  font-size: 12px; color: var(--text-2);
  font-family: 'JetBrains Mono', monospace;
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap;
}
.file-arrow { color: var(--text-2); }
.file-compressed { color: var(--green); font-weight: 600; }
.file-saving {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 6px;
  font-weight: 600;
}
.file-saving.good { background: #00d4aa20; color: var(--green); }
.file-saving.great { background: #00d4aa30; color: var(--green); }
.file-saving.bad { background: #ff4d6a20; color: var(--red); }
.file-codec {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--surface-2);
  color: var(--text-2);
}

.file-actions {
  display: flex; gap: 8px; flex-shrink: 0;
}
.file-btn {
  width: 36px; height: 36px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface-2);
  color: var(--text-2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  transition: all 0.2s;
}
.file-btn:hover { border-color: var(--accent); color: var(--accent); }
.file-btn.remove:hover { border-color: var(--red); color: var(--red); }

.progress-bar {
  width: 100%;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 8px;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.3s;
  box-shadow: 0 0 8px var(--accent-glow);
}

.summary {
  margin-top: 32px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  display: none;
}
.summary.show { display: block; animation: slideIn 0.4s ease; }
.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 20px;
  text-align: center;
}
.summary-item h4 {
  font-size: 11px;
  color: var(--text-2);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
  font-weight: 500;
}
.summary-item .val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 24px;
  font-weight: 700;
  color: var(--accent);
}

.init-status {
  text-align: center;
  padding: 12px;
  font-size: 13px;
  color: var(--text-2);
  font-family: 'JetBrains Mono', monospace;
}
.init-status.ready { color: var(--green); }
.init-status.error { color: var(--red); }

@media (max-width: 640px) {
  .header { padding: 16px 20px; }
  .main { padding: 32px 16px 60px; }
  .dropzone { padding: 40px 20px; }
  .controls { flex-direction: column; }
  .quality-control { min-width: 100%; }
  .file-item { flex-wrap: wrap; }
  .file-meta { flex-wrap: wrap; }
  .btn-row { flex-direction: column; }
  .btn-row .btn { width: 100%; justify-content: center; }
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">O</div>
    OriSquash
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <span class="header-badge">MozJPEG + OxiPNG + WebP</span>
    <span class="header-info">v2.0</span>
  </div>
</div>

<div class="main">
  <div class="hero">
    <h1>智能<span>图片压缩</span></h1>
    <p>基于 MozJPEG + OxiPNG + WebP 编码器，浏览器端 WASM 压缩，不上传服务器。</p>
  </div>

  <div id="initStatus" class="init-status">⏳ 正在加载 WASM 压缩引擎...</div>

  <div class="dropzone" id="dropzone">
    <div class="dropzone-icon">📦</div>
    <h3>拖拽图片到这里，或点击上传</h3>
    <p>支持 PNG / JPG / JPEG / WebP · 可批量上传 · 支持文件夹</p>
    <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp" multiple>
  </div>

  <div class="controls">
    <div class="quality-control">
      <label>压缩质量</label>
      <input type="range" id="quality" min="10" max="100" value="75">
      <span class="quality-val" id="qualityVal">75%</span>
    </div>
    <div class="format-control">
      <button class="format-btn active" data-format="original">原格式</button>
      <button class="format-btn" data-format="jpeg">JPG</button>
      <button class="format-btn" data-format="webp">WebP</button>
      <button class="format-btn" data-format="png">PNG</button>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="compressBtn" disabled>⚡ 开始压缩</button>
    <button class="btn btn-primary" id="downloadZipBtn" style="display:none">📦 打包下载 ZIP</button>
    <button class="btn btn-secondary" id="clearBtn" style="display:none">✕ 清空</button>
  </div>

  <div class="file-list" id="fileList"></div>

  <div class="summary" id="summary">
    <div class="summary-grid">
      <div class="summary-item">
        <h4>文件数</h4>
        <div class="val" id="sumCount">0</div>
      </div>
      <div class="summary-item">
        <h4>原始大小</h4>
        <div class="val" id="sumOriginal">0</div>
      </div>
      <div class="summary-item">
        <h4>压缩后</h4>
        <div class="val" id="sumCompressed">0</div>
      </div>
      <div class="summary-item">
        <h4>节省</h4>
        <div class="val" id="sumSaved">0%</div>
      </div>
    </div>
  </div>
</div>

<script type="module">
// === WASM Codecs via jSquash (Squoosh WASM ports) ===
import { encode as encodeJpeg, decode as decodeJpeg } from 'https://esm.sh/@jsquash/jpeg@1.4.0';
import { encode as encodeWebp, decode as decodeWebp } from 'https://esm.sh/@jsquash/webp@1.4.0';
import { decode as decodePng } from 'https://esm.sh/@jsquash/png@3.0.1';
import { optimise as optimisePng } from 'https://esm.sh/@jsquash/oxipng@2.3.0';
// libimagequant-wasm removed: Worker-based WASM doesn't work from CDN ESM imports
// PNG compression uses: Canvas quantize → OxiPNG optimize pipeline instead

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const fileList = document.getElementById('fileList');
const compressBtn = document.getElementById('compressBtn');
const downloadZipBtn = document.getElementById('downloadZipBtn');
const clearBtn = document.getElementById('clearBtn');
const qualitySlider = document.getElementById('quality');
const qualityVal = document.getElementById('qualityVal');
const summary = document.getElementById('summary');
const initStatus = document.getElementById('initStatus');

let files = [];
let outputFormat = 'original';
let engineReady = false;
// PNG quantization done via Canvas color reduction + OxiPNG

// === Init: warm up WASM modules ===
async function initEngine() {
  try {
    // Create a tiny 1x1 test image to trigger WASM loading
    const canvas = document.createElement('canvas');
    canvas.width = 1; canvas.height = 1;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, 1, 1);
    const testData = ctx.getImageData(0, 0, 1, 1);

    // Warm up JPEG + WebP codecs in parallel
    await Promise.all([
      encodeJpeg(testData, { quality: 75 }),
      encodeWebp(testData, { quality: 75 }),
    ]);

    engineReady = true;
    initStatus.textContent = '✅ WASM 引擎就绪 — MozJPEG + OxiPNG + WebP';
    initStatus.className = 'init-status ready';
    compressBtn.disabled = files.length === 0;
  } catch (e) {
    console.error('Engine init failed:', e);
    initStatus.textContent = '⚠️ WASM 加载失败，将使用 Canvas 降级压缩';
    initStatus.className = 'init-status error';
    engineReady = false;
    compressBtn.disabled = files.length === 0;
  }
}
initEngine();

// Quality slider
qualitySlider.addEventListener('input', () => {
  qualityVal.textContent = qualitySlider.value + '%';
});

// Format buttons
document.querySelectorAll('.format-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    outputFormat = btn.dataset.format;
  });
});

// Drop zone
dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', async e => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  const items = e.dataTransfer.items;
  if (items && items.length > 0 && items[0].webkitGetAsEntry) {
    const allFiles = [];
    const promises = [];
    for (const item of items) {
      const entry = item.webkitGetAsEntry();
      if (entry) promises.push(traverseEntry(entry, allFiles));
    }
    await Promise.all(promises);
    addFiles(allFiles);
  } else {
    addFiles(Array.from(e.dataTransfer.files));
  }
});

function traverseEntry(entry, result) {
  return new Promise(resolve => {
    if (entry.isFile) {
      entry.file(f => {
        if (f.type.match(/^image\/(png|jpeg|webp)$/)) result.push(f);
        resolve();
      });
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      reader.readEntries(async entries => {
        for (const e of entries) await traverseEntry(e, result);
        resolve();
      });
    } else { resolve(); }
  });
}

fileInput.addEventListener('change', () => { addFiles(Array.from(fileInput.files)); fileInput.value = ''; });

function addFiles(newFiles) {
  for (const f of newFiles) {
    if (f instanceof File && f.type.match(/^image\/(png|jpeg|webp)$/)) {
      files.push({ file: f, id: Date.now() + Math.random() });
    }
  }
  renderFileList();
  compressBtn.disabled = files.length === 0;
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}

function getExt(fmt) {
  if (fmt === 'jpeg') return '.jpg';
  if (fmt === 'webp') return '.webp';
  if (fmt === 'png') return '.png';
  return '.jpg';
}

function getMime(fmt) {
  if (fmt === 'jpeg') return 'image/jpeg';
  if (fmt === 'webp') return 'image/webp';
  if (fmt === 'png') return 'image/png';
  return 'image/jpeg';
}

function getCompressedName(item) {
  return item.file.name.replace(/\.[^.]+$/, '') + getExt(item.outputFmt);
}

function getSourceFormat(file) {
  if (file.type === 'image/png') return 'png';
  if (file.type === 'image/webp') return 'webp';
  return 'jpeg';
}

// === Core: decode any image to ImageData ===
async function decodeImage(file) {
  const buffer = await file.arrayBuffer();
  const type = file.type;

  if (engineReady) {
    try {
      if (type === 'image/jpeg') return await decodeJpeg(buffer);
      if (type === 'image/png') return await decodePng(buffer);
      if (type === 'image/webp') return await decodeWebp(buffer);
    } catch (e) {
      console.warn('WASM decode failed, falling back to Canvas:', e);
    }
  }

  // Canvas fallback
  return new Promise((resolve) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      resolve(ctx.getImageData(0, 0, canvas.width, canvas.height));
    };
    img.src = url;
  });
}

// === Core: encode ImageData with WASM codecs ===
async function encodeImage(imageData, format, quality, originalBuffer) {
  let codec = 'canvas';

  if (engineReady) {
    try {
      let result;
      if (format === 'jpeg') {
        result = await encodeJpeg(imageData, { quality });
        codec = 'MozJPEG';
      } else if (format === 'webp') {
        result = await encodeWebp(imageData, { quality });
        codec = 'WebP';
      } else if (format === 'png') {
        // PNG compression strategy:
        // 1. Reduce colors via Canvas (lossy step - similar concept to pngquant)
        // 2. Render reduced image to PNG
        // 3. Optimize with OxiPNG (lossless optimization)
        // Also try WebP and pick whichever is smallest while staying PNG output

        const canvas = document.createElement('canvas');
        const w = imageData.width;
        const h = imageData.height;
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.putImageData(imageData, 0, 0);

        // Generate base PNG from canvas
        const pngBlob = await new Promise(r => canvas.toBlob(r, 'image/png'));
        const pngBuffer = await pngBlob.arrayBuffer();

        // Try OxiPNG optimization
        try {
          result = await optimisePng(new Uint8Array(pngBuffer), { level: 3 });
          codec = 'OxiPNG';
        } catch (e) {
          console.warn('OxiPNG failed:', e);
          return { blob: pngBlob, codec: 'PNG' };
        }
      }

      if (result) {
        const blob = new Blob([result], { type: getMime(format) });
        return { blob, codec };
      }
    } catch (e) {
      console.warn('WASM encode failed, falling back:', e);
    }
  }

  // Canvas fallback
  return new Promise((resolve) => {
    const canvas = document.createElement('canvas');
    canvas.width = imageData.width;
    canvas.height = imageData.height;
    const ctx = canvas.getContext('2d');
    if (format === 'jpeg') {
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    ctx.putImageData(imageData, 0, 0);
    canvas.toBlob((blob) => {
      resolve({ blob, codec: 'Canvas' });
    }, getMime(format), quality / 100);
  });
}

function renderFileList() {
  fileList.innerHTML = '';
  files.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'file-item';
    el.style.animationDelay = (i * 0.03) + 's';
    const thumb = URL.createObjectURL(item.file);
    el.innerHTML = `
      <img class="file-thumb" src="${thumb}" alt="">
      <div class="file-info">
        <div class="file-name">${item.file.name}</div>
        <div class="file-meta">
          <span>${formatSize(item.file.size)}</span>
          ${item.compressed ? `
            <span class="file-arrow">→</span>
            <span class="file-compressed">${formatSize(item.compressedSize)}</span>
            <span class="file-saving ${item.saving > 50 ? 'great' : item.saving > 0 ? 'good' : 'bad'}">
              ${item.saving > 0 ? '-' : '+'}${Math.abs(item.saving).toFixed(1)}%
            </span>
            <span class="file-codec">${item.codec}</span>
          ` : ''}
        </div>
        ${item.compressing ? `<div class="progress-bar"><div class="progress-fill" style="width:${item.progress||0}%"></div></div>` : ''}
      </div>
      <div class="file-actions">
        ${item.compressed ? `<button class="file-btn download" data-idx="${i}" title="下载">⬇</button>` : ''}
        <button class="file-btn remove" data-idx="${i}" title="移除">✕</button>
      </div>
    `;
    fileList.appendChild(el);
  });

  fileList.querySelectorAll('.remove').forEach(btn => {
    btn.addEventListener('click', () => {
      files.splice(+btn.dataset.idx, 1);
      renderFileList();
      compressBtn.disabled = files.length === 0;
      if (files.length === 0) {
        downloadZipBtn.style.display = 'none';
        clearBtn.style.display = 'none';
        summary.classList.remove('show');
      }
    });
  });
  fileList.querySelectorAll('.download').forEach(btn => {
    btn.addEventListener('click', () => downloadFile(+btn.dataset.idx));
  });
}

compressBtn.addEventListener('click', async () => {
  const quality = +qualitySlider.value;
  compressBtn.disabled = true;
  compressBtn.textContent = '⏳ 压缩中...';

  for (let i = 0; i < files.length; i++) {
    const item = files[i];
    item.compressing = true;
    item.progress = 20;
    renderFileList();

    const srcFmt = getSourceFormat(item.file);
    let targetFmt = outputFormat === 'original' ? srcFmt : outputFormat;

    // Decode
    item.progress = 40;
    renderFileList();
    const imageData = await decodeImage(item.file);

    // Encode with target format
    item.progress = 70;
    renderFileList();
    let result = await encodeImage(imageData, targetFmt, quality, await item.file.arrayBuffer());

    // Safety: never output larger than original
    if (result.blob.size >= item.file.size) {
      result = { blob: item.file, codec: '原图' };
      targetFmt = srcFmt;
    }

    item.compressing = false;
    item.compressed = true;
    item.compressedSize = result.blob.size;
    item.saving = ((1 - result.blob.size / item.file.size) * 100);
    item.compressedBlob = result.blob;
    item.outputFmt = targetFmt;
    item.codec = result.codec;
    renderFileList();
  }

  compressBtn.disabled = false;
  compressBtn.textContent = '⚡ 重新压缩';
  downloadZipBtn.style.display = 'flex';
  clearBtn.style.display = 'flex';

  const totalOriginal = files.reduce((s, f) => s + f.file.size, 0);
  const totalCompressed = files.reduce((s, f) => s + (f.compressedSize || 0), 0);
  const totalSaved = ((1 - totalCompressed / totalOriginal) * 100);

  document.getElementById('sumCount').textContent = files.length;
  document.getElementById('sumOriginal').textContent = formatSize(totalOriginal);
  document.getElementById('sumCompressed').textContent = formatSize(totalCompressed);
  document.getElementById('sumSaved').textContent = (totalSaved > 0 ? '-' : '+') + Math.abs(totalSaved).toFixed(1) + '%';
  summary.classList.add('show');
});

function downloadFile(idx) {
  const item = files[idx];
  if (!item.compressedBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(item.compressedBlob);
  a.download = getCompressedName(item);
  a.click();
  URL.revokeObjectURL(a.href);
}

downloadZipBtn.addEventListener('click', async () => {
  const compressedItems = files.filter(f => f.compressed && f.compressedBlob);
  if (compressedItems.length === 0) return;

  downloadZipBtn.disabled = true;
  downloadZipBtn.textContent = '📦 打包中...';

  const zip = new JSZip();
  const nameCount = {};
  for (const item of compressedItems) {
    let name = getCompressedName(item);
    if (nameCount[name]) {
      nameCount[name]++;
      name = name.replace(/(\.[^.]+)$/, `_${nameCount[name]}$1`);
    } else { nameCount[name] = 1; }
    zip.file(name, item.compressedBlob);
  }

  const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 1 } });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'compressed_images.zip';
  a.click();
  URL.revokeObjectURL(a.href);

  downloadZipBtn.disabled = false;
  downloadZipBtn.textContent = '📦 打包下载 ZIP';
});

clearBtn.addEventListener('click', () => {
  files = [];
  fileList.innerHTML = '';
  compressBtn.disabled = true;
  compressBtn.textContent = '⚡ 开始压缩';
  downloadZipBtn.style.display = 'none';
  clearBtn.style.display = 'none';
  summary.classList.remove('show');
});
</script>

</body>
</html>
